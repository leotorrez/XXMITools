name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Bump version in pyproject.toml and __init__.py
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"
        sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
        sed -i -E "s/\"version\": \([0-9]+, [0-9]+, [0-9]+\)/\"version\": (${MAJOR}, ${MINOR}, ${PATCH})/" __init__.py

    - name: Commit version bump, push branch and move tag
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        TAG_COMMIT="$(git rev-parse HEAD)"
        BRANCH="$(git ls-remote --heads origin | awk -v sha="${TAG_COMMIT}" '$1 == sha { sub("refs/heads/", "", $2); print $2; exit }')"
        BRANCH="${BRANCH:-${{ github.event.repository.default_branch }}}"
        echo "Version bump will be pushed to branch: ${BRANCH}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add pyproject.toml __init__.py
        if git diff --staged --quiet; then
          echo "Version already up to date, nothing to commit"
        else
          git commit -m "Version bump ${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          git tag -f "${GITHUB_REF_NAME}"
          git push origin "refs/tags/${GITHUB_REF_NAME}" --force
        fi

    - name: Move contents to XXMITools folder
      run: |
        mkdir XXMITools
        shopt -s extglob
        mv !(XXMITools) XXMITools

    - name: Create zip of repository
      run: zip -r XXMITools_${{ github.ref_name }}.zip XXMITools

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: XXMITools_${{ github.ref_name }}.zip
        name: Release ${{ github.ref_name }}
        body: |
          See the [changelog](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}) for details.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
